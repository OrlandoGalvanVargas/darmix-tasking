services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_backend_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-task_manager}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
    networks:
      - backend_net

  web:
    image: nginx:alpine
    container_name: task_manager_backend_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - backend_net

  db:
    image: mysql:8.0
    container_name: task_manager_backend_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-task_manager}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  db_data:
    driver: local
