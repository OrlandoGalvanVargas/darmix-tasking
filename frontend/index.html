<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Darmix Tasking — Gestión de proyectos y tareas"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Darmix Tasking" />
    <meta
      property="og:description"
      content="Gestión de proyectos y tareas donde cada tarea es una hoja."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="theme-color" content="#fdfcfb" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("task-manager:theme");
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#1a1c22" : "#fdfcfb");
        } catch (e) {}
      })();
    </script>
    <title>Darmix Tasking | Organiza tu trabajo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
